on:
  pull_request:
  issues:
    types:
      - opened
permissions:
  contents: read
  issues: write
jobs:
  add-to-project:
    name: Add issue to project
    if: github.actor != 'dependabot[bot]'
    # truemark/github-workflows@main as of 2026-06-10
    uses: truemark/github-workflows/.github/workflows/issues.yml@1fe9881c23e60770fbdfb7d0a45552b9697b3274
    secrets:
      private-key: ${{ secrets.ISSUES_BOT_KEY }}
      app-id: ${{ secrets.ISSUES_BOT_ID }}
