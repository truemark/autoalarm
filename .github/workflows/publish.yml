on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
name: publish
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    # truemark/github-workflows@main as of 2026-06-10
    uses: truemark/github-workflows/.github/workflows/javascript-library.yml@1fe9881c23e60770fbdfb7d0a45552b9697b3274
    with:
      node-versions: "[18,20,22]"
      publish-node-version: "22"
      pnpm-version: "10"
    secrets:
      app-id: ${{ secrets.RELEASE_BOT_ID }}
      private-key: ${{ secrets.RELEASE_BOT_KEY }}
